name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Version Tag (e.g. v0.1.1)'
        required: true
        default: 'v0.1.1'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Release macOS App
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          # Strip leading v for CFBundleShortVersionString
          RAW_VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$RAW_VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version $RAW_VERSION ($TAG)..."
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $RAW_VERSION" Resources/Info.plist

      - name: Run Unit Tests
        run: |
          swift run DoubaoVoiceHelperCoreTests

      - name: Install Signing Certificate
        env:
          SIGNING_CERT_BASE64: ${{ secrets.SIGNING_CERTIFICATE_P12_BASE64 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "${SIGNING_CERT_BASE64:-}" ]; then
            echo "No signing certificate secret configured, skipping."
            exit 0
          fi
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          P12_PATH="$RUNNER_TEMP/signing.p12"

          echo "$SIGNING_CERT_BASE64" | base64 --decode > "$P12_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$P12_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$SIGNING_CERT_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          EXISTING_KEYCHAINS="$(security list-keychains -d user | tr -d '"' | tr '\n' ' ')"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $EXISTING_KEYCHAINS
          security default-keychain -s "$KEYCHAIN_PATH"

          echo "CODESIGN_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          rm -f "$P12_PATH"

      - name: Build Application (.app)
        env:
          CONFIGURATION: "release"
        run: |
          ./scripts/build_app.sh

      - name: Package Distribution ZIP
        run: |
          ditto -c -k --keepParent "build/DoubaoVoiceHelper.app" "build/DoubaoVoiceHelper.zip"

      - name: Package Distribution DMG
        run: |
          ./scripts/build_dmg.sh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: 豆包语音助手 ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            build/DoubaoVoiceHelper.zip
            build/DoubaoVoiceHelper.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
